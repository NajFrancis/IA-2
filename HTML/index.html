<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Inconsolata:wght@200..900&family=Permanent+Marker&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
        <script src="../js/validation.js" defer></script>
        <title>IA#2</title>
        <link rel="stylesheet" href="../css/style.css">
    </head>
    <body>
        <main>

            <div class="logo">
                <img src="../assets/images/logo-full.svg" alt="Coding Conf">
            </div>
            <div class="title">
                <h1>Your Journey to Coding Conf<br>2025 Starts Here!</h1>
            </div>
            <div class="subtitle">
                <h2>Secure your spot at next year's biggest coding conference</h2>
            </div>
            <div class="form-container">
                <form id="registration-form" action="ticket.html"> <!-- action sends the data to ticket page -->
                    <span>Upload Avatar</span> <br>
                    <label class="avatar-box">
                        <input class="avatar-input" type="file" id="avatar" name="avatar"
                        accept="image/png, image/jpeg">
                        <img src="../assets/images/icon-upload.svg" alt="">
                        <span>Click to upload your photo</span>
                    </label> <br>

                    <label for="full-name">Full Name</label> <br>
                    <input type="text" id="full-name" name="Full Name" required> <br>

                    <label for="email">Email Address</label>
                    <input type="text" id="email" name="Email" required> <br>

                    <label for="github-username">GitHub Username</label><br>
                    <input type="text" id="github-username" name="githubUsername"><br>

                    <input type="submit" value="Submit">
                </form>
            </div>
        </main>
    </body>
</html>
