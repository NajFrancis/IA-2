<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Inconsolata:wght@200..900&family=Permanent+Marker&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
        <script src="../js/ticket.js" defer></script>
        <title>IA#2</title>
        <link rel="stylesheet" href="../css/style.css">
    </head>
<body>
        <main>

            <div class="logo">
                <img src="../assets/images/logo-full.svg" alt="Coding Conf">
            </div>
            <div class="title">
                <h1>Congrats <span id="fullName" class="Name"> [Full Name]</span>!<br>Your ticket is ready.</h1>
            </div>
            <div class="subtitle2">
                <h2>We've emailed your ticket to<br><span id="email">[Email]</span> and will send updates in <br>
                the run up to the event.</h2>
            </div>
            <div class="ticket-container">
                <div class="ticket-info-container">
                    <img class="ticket-logo" src="../assets/images/logo-full.svg" alt="Coding Conf">
                    <div class="attendee-data">
                        <div class="avatar"><img id="avatar" src="../assets/images/user.png" alt="avatar"></div>
                        <div class="attendee-data2">
                            <div id="attendee-name" class="attendee-name"><h3>[attendee-name]</h3></div>
                            <div id="attendee-git" class="attendee-git">
                                <h3>[attendee-git]</h3>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="ticket-number">
                    <h3 id="ticket-number">[Ticket Number]</h3>
                </div>
                
            </div>  
        </main>
    </body>
</html>
